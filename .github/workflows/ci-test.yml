name: CI 测试

on:
  push:
    branches:
      - main
      - 'copilot/**'
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建镜像（仅本地，不推送）
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          # CI 构建仅针对当前平台（linux/amd64），多平台构建由 nightly-build.yml 负责
          platforms: linux/amd64
          tags: ai-coding-base:ci-test

      - name: 冒烟测试：验证 opencode 正常启动（无配置错误）
        run: |
          echo "=== 测试 opencode --version ==="
          OUTPUT=$(docker run --rm ai-coding-base:ci-test opencode --version 2>&1)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "Configuration is invalid"; then
            echo "❌ opencode 配置验证失败！"
            exit 1
          fi
          echo "✅ opencode 启动正常，无配置错误"

      - name: 冒烟测试：验证所有工具版本
        run: |
          echo "=== node --version ==="
          docker run --rm ai-coding-base:ci-test node --version

          echo "=== opencode --version ==="
          docker run --rm ai-coding-base:ci-test opencode --version

          echo "=== claude --version ==="
          docker run --rm ai-coding-base:ci-test claude --version || true

          echo "=== copilot --version ==="
          docker run --rm ai-coding-base:ci-test copilot --version || true

          echo "✅ 所有工具验证完成"

      - name: 验证 opencode 配置文件格式正确
        run: |
          echo "=== 检查容器内配置文件内容 ==="
          docker run --rm ai-coding-base:ci-test cat /root/.config/opencode/config.json
          echo ""
          echo "=== 验证 instructions 字段为数组类型 ==="
          docker run --rm ai-coding-base:ci-test \
            node -e "
const fs = require('fs');
const cfg = JSON.parse(fs.readFileSync('/root/.config/opencode/config.json', 'utf8'));
const instructions = cfg.instructions;
if (!Array.isArray(instructions)) {
  console.error('❌ instructions 字段不是数组类型！实际类型：' + typeof instructions);
  process.exit(1);
}
console.log('✅ instructions 字段为数组类型，共 ' + instructions.length + ' 条规则');
"
