name: CI 测试

on:
  push:
    branches:
      - main
      - 'copilot/**'
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建镜像（仅本地，不推送）
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          # CI 构建仅针对当前平台（linux/amd64），多平台构建由 nightly-build.yml 负责
          platforms: linux/amd64
          tags: ai-coding-base:ci-test

      - name: 冒烟测试：验证 opencode 正常启动（无配置错误）
        run: |
          echo "=== 测试 opencode --version ==="
          OUTPUT=$(docker run --rm ai-coding-base:ci-test opencode --version 2>&1)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "Configuration is invalid"; then
            echo "❌ opencode 配置验证失败！"
            exit 1
          fi
          echo "✅ opencode 启动正常，无配置错误"

      - name: 冒烟测试：验证所有工具版本
        run: |
          echo "=== node --version ==="
          docker run --rm ai-coding-base:ci-test node --version

          echo "=== opencode --version ==="
          docker run --rm ai-coding-base:ci-test opencode --version

          echo "=== claude --version ==="
          docker run --rm ai-coding-base:ci-test claude --version

          echo "=== copilot --version ==="
          docker run --rm ai-coding-base:ci-test copilot --version

          echo "✅ 所有工具验证完成"

      - name: 验证 opencode 配置文件格式正确
        run: |
          echo "=== 检查容器内配置文件内容 ==="
          docker run --rm ai-coding-base:ci-test cat /root/.config/opencode/config.json
          echo ""
          echo "=== 验证 instructions 字段为数组类型 ==="
          docker run --rm ai-coding-base:ci-test node -e \
            "var cfg=JSON.parse(require('fs').readFileSync('/root/.config/opencode/config.json','utf8'));if(!Array.isArray(cfg.instructions)){console.error('FAILED: instructions is not an array, got '+typeof cfg.instructions);process.exit(1);}console.log('OK: instructions is array with '+cfg.instructions.length+' item(s)');"
          echo "✅ 配置文件格式验证通过"

      - name: 验证容器内关键文件存在
        run: |
          echo "=== 验证 OpenCode 配置文件 ==="
          docker run --rm ai-coding-base:ci-test test -f /root/.config/opencode/config.json \
            && echo "✅ /root/.config/opencode/config.json 存在" \
            || (echo "❌ /root/.config/opencode/config.json 不存在"; exit 1)

          echo "=== 验证 Claude 配置文件 ==="
          docker run --rm ai-coding-base:ci-test test -f /root/.claude/settings.json \
            && echo "✅ /root/.claude/settings.json 存在" \
            || (echo "❌ /root/.claude/settings.json 不存在"; exit 1)

          echo "=== 验证 AGENTS.md 文件 ==="
          docker run --rm ai-coding-base:ci-test test -f /root/AGENTS.md \
            && echo "✅ /root/AGENTS.md 存在" \
            || (echo "❌ /root/AGENTS.md 不存在"; exit 1)

          echo "✅ 所有关键文件验证通过"

      - name: 验证工具二进制文件可执行
        run: |
          echo "=== 验证 opencode 二进制文件 ==="
          docker run --rm ai-coding-base:ci-test which opencode \
            && echo "✅ opencode 在 PATH 中可用" \
            || (echo "❌ opencode 不在 PATH 中"; exit 1)

          echo "=== 验证 claude 二进制文件 ==="
          docker run --rm ai-coding-base:ci-test which claude \
            && echo "✅ claude 在 PATH 中可用" \
            || (echo "❌ claude 不在 PATH 中"; exit 1)

          echo "=== 验证 copilot 二进制文件 ==="
          docker run --rm ai-coding-base:ci-test which copilot \
            && echo "✅ copilot 在 PATH 中可用" \
            || (echo "❌ copilot 不在 PATH 中"; exit 1)

          echo "=== 验证 gh 二进制文件 ==="
          docker run --rm ai-coding-base:ci-test which gh \
            && echo "✅ gh 在 PATH 中可用" \
            || (echo "❌ gh 不在 PATH 中"; exit 1)

          echo "✅ 所有工具二进制文件验证通过"

      - name: 验证 Claude 配置文件格式正确
        run: |
          echo "=== 检查 Claude settings.json 内容 ==="
          docker run --rm ai-coding-base:ci-test cat /root/.claude/settings.json
          echo ""
          echo "=== 验证 Claude 配置为合法 JSON ==="
          docker run --rm ai-coding-base:ci-test node -e \
            "var cfg=JSON.parse(require('fs').readFileSync('/root/.claude/settings.json','utf8'));console.log('OK: Claude settings.json is valid JSON with keys: '+Object.keys(cfg).join(', '));"
          echo "✅ Claude 配置文件格式验证通过"

      - name: 验证 AGENTS.md 内容不为空
        run: |
          echo "=== 检查 AGENTS.md 内容 ==="
          LINES=$(docker run --rm ai-coding-base:ci-test bash -c "wc -l < /root/AGENTS.md")
          echo "AGENTS.md 行数：$LINES"
          if [ -z "$LINES" ] || [ "$LINES" -lt 1 ]; then
            echo "❌ AGENTS.md 为空！"
            exit 1
          fi
          echo "✅ AGENTS.md 内容验证通过"
